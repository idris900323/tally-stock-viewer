<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Accounts - Verification Required</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo.jpg') }}">
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #14213d;
            --muted: #607086;
            --border: #d6e0ea;
            --accent: #0f766e;
            --danger: #b91c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 26%),
                radial-gradient(circle at top right, rgba(29, 78, 216, 0.12), transparent 22%),
                var(--bg);
            color: var(--text);
        }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
        }

        .panel {
            width: min(100%, 520px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 18px 50px rgba(20, 33, 61, 0.1);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.5;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 16px;
        }

        .notice {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            font-size: 13px;
        }

        .hint {
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 12px;
            border: 0;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
        }

        .link-button {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        @media (max-width: 640px) {
            .page {
                padding: 14px;
            }

            .panel {
                padding: 20px;
            }

            .actions button,
            .actions a {
                width: 100%;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <form class="panel" method="post" action="/admin/accounts/unlock">
        <h1>Verification Required</h1>
        <p>Manage Accounts is protected by a separate password. Enter it to continue.</p>

        {% if error %}
        <div class="notice">{{ error }}</div>
        {% endif %}

        <input type="hidden" name="next" value="{{ next_url }}">

        <div class="field">
            <label for="password">Accounts Password</label>
            <input id="password" name="password" type="password" autocomplete="off" autofocus required>
        </div>

        <div class="hint">
            This is separate from your admin login and is required again each session.
        </div>

        <div class="actions">
            <button type="submit">Unlock</button>
            <a class="link-button" href="/" style="padding:12px 16px; border-radius:12px; font-size:14px; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">Back to Home</a>
        </div>
    </form>
</div>
</body>
</html>
