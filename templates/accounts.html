<!DOCTYPE html>
<html>
<head>
    <title>Accounts Admin - Super Seatings</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo.jpg') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #f3f6fb;
            --panel: #ffffff;
            --text: #132238;
            --muted: #5d6b82;
            --border: #d9e2ec;
            --accent: #1f6feb;
            --success-bg: #e8f5e9;
            --success-text: #276749;
            --error-bg: #fdecea;
            --error-text: #b42318;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(31, 111, 235, 0.14), transparent 24%),
                radial-gradient(circle at top right, rgba(20, 184, 166, 0.12), transparent 20%),
                var(--bg);
        }

        .page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 20px 40px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 14px 40px rgba(19, 34, 56, 0.08);
            margin-bottom: 16px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            position: sticky;
            top: 8px;
            z-index: 40;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(19, 34, 56, 0.08);
        }

        .topbar-left,
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .link-button {
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .link-button:hover {
            background: #eef2f7;
        }

        .role-indicator {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            padding: 0 2px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
        }

        /* Grid items default to min-width:auto (content-based), so the
           table's own min-width:960px (below) was pulling this whole column
           -- and the page along with it -- wider than the viewport on
           narrow screens, even though .table-wrap already had overflow-x:
           auto set up to make just the table scroll horizontally instead.
           min-width:0 lets the item actually shrink to its grid track so
           that intended containment takes over. */
        .grid > .panel {
            min-width: 0;
        }

        label {
            font-weight: 700;
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: block;
            margin-bottom: 6px;
        }

        input, button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        input {
            background: #fff;
            width: 100%;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: 0;
            cursor: pointer;
        }

        button.secondary {
            background: #e8eef7;
            color: var(--text);
        }

        .notice {
            display: none;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .notice.success {
            color: var(--success-text);
            background: var(--success-bg);
        }

        .notice.error {
            color: var(--error-text);
            background: var(--error-bg);
        }

        .field-row {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 960px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .muted {
            color: var(--muted);
            font-size: 13px;
        }

        .status-active,
        .status-paused {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-active {
            color: var(--success-text);
            background: var(--success-bg);
        }

        .status-paused {
            color: #6b7280;
            background: #f3f4f6;
        }

        .btn-delete {
            background: #dc2626;
            color: #fff;
        }

        .bulk-actions {
            margin-bottom: 12px;
        }

        @media (max-width: 980px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .page {
                padding: 18px 12px 28px;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .topbar-left,
            .topbar-right {
                width: 100%;
                justify-content: space-between;
            }

            .link-button {
                width: auto;
                min-height: 44px;
            }

            #createUserBtn {
                width: 100%;
            }

            .bulk-actions button {
                flex: 1;
            }

            button {
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div class="topbar-left">
            <a href="/" class="link-button" title="Return to the main stock viewer page">Home</a>
            <a href="/train" class="link-button" title="Go to the training mode stock matching page">Train Matches</a>
        </div>
        <div class="topbar-right">
            <span class="role-indicator">{{ current_role|default('admin')|title }} mode</span>
            <a href="/logout" class="link-button" title="Sign out of your account">Logout</a>
        </div>
    </div>

    <div class="panel">
        <h1 style="margin:0 0 10px;">Account Management</h1>
        <p class="muted" style="margin:0;">Create and delete customer accounts from this page.</p>
    </div>

    <div id="successMsg" class="notice success"></div>
    <div id="errorMsg" class="notice error"></div>

    <div class="grid">
        <div class="panel">
            <h2 style="margin:0 0 12px;">Create New Customer Account</h2>
            <form id="createCustomerForm">
                <div class="field-row">
                    <label for="new_username">Username</label>
                    <input id="new_username" name="username" type="text" required>
                </div>
                <div class="field-row">
                    <label for="new_access_code">Access Code</label>
                    <input id="new_access_code" name="access_code" type="text" required>
                </div>
                <button id="createUserBtn" type="submit">Create Account</button>
            </form>
        </div>

        <div class="panel">
            <h2 style="margin:0 0 10px;">Manage Customer Accounts</h2>
            <div class="bulk-actions toolbar">
                <button type="button" class="secondary" onclick="setAllCustomerStatus(true)" title="Resume login access for every customer account">Resume All</button>
                <button type="button" class="secondary" onclick="setAllCustomerStatus(false)" title="Pause login access for every customer account">Pause All</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:200px;">Username</th>
                            <th style="width:160px;" title="This code is used by the customer to log in">Access Code</th>
                            <th style="width:110px;">Status</th>
                            <th style="width:200px;">Last Login</th>
                            <th style="width:180px;">Created</th>
                            <th style="width:220px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="accountsTableBody"></tbody>
                </table>
            </div>
            <div id="accountsEmptyState" class="muted" style="display:none; margin-top:10px;">No customer accounts found.</div>
        </div>
    </div>
</div>

<script>
const initialStatus = {{ status_message|tojson }};
const initialError = {{ error_message|tojson }};
let customerAccounts = [];

function showSuccess(message) {
    const el = document.getElementById("successMsg");
    el.textContent = message;
    el.style.display = "block";
    document.getElementById("errorMsg").style.display = "none";
}

function showError(message) {
    const el = document.getElementById("errorMsg");
    el.textContent = message;
    el.style.display = "block";
    document.getElementById("successMsg").style.display = "none";
}

function formatDateLabel(value) {
    const date = value ? new Date(value) : null;
    if (!date || Number.isNaN(date.getTime())) {
        return "-";
    }
    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = date.getFullYear();
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");
    const seconds = String(date.getSeconds()).padStart(2, "0");
    return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
}

function formatLastLoginLabel(value) {
    if (!value) {
        return "Never";
    }
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return "Never";
    }
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const day = String(date.getDate()).padStart(2, "0");
    const month = months[date.getMonth()];
    const year = date.getFullYear();
    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if (hours === 0) {
        hours = 12;
    }
    return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
}

function escapeHtml(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
}

async function createUserAccount() {
    const usernameInput = document.getElementById("new_username");
    const accessInput = document.getElementById("new_access_code");
    const btn = document.getElementById("createUserBtn");

    const username = String(usernameInput?.value || "").trim();
    const accessCode = String(accessInput?.value || "").trim();

    if (!username || !accessCode) {
        showError("Please enter both username and access code.");
        return;
    }

    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Creating...";

    try {
        const response = await fetch("/admin/create_user", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, access_code: accessCode }),
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.error || `Create failed (HTTP ${response.status})`);
        }

        usernameInput.value = "";
        accessInput.value = "";
        showSuccess(result.message || "Account created successfully");
        await loadCustomerAccounts();
    } catch (error) {
        showError(error.message);
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
}

function renderAccountsTable(customers) {
    const body = document.getElementById("accountsTableBody");
    const empty = document.getElementById("accountsEmptyState");

    if (!Array.isArray(customers) || customers.length === 0) {
        body.innerHTML = "";
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";
    body.innerHTML = customers.map(customer => {
        const createdLabel = formatDateLabel(customer.created_at);
        const lastLoginLabel = formatLastLoginLabel(customer.last_login);
        const isActive = customer.is_active !== false;
        const statusBadge = isActive
            ? `<span class="status-active">Active</span>`
            : `<span class="status-paused">Paused</span>`;
        const toggleLabel = isActive ? "Pause" : "Resume";
        return `
            <tr>
                <td>${escapeHtml(customer.username || "")}</td>
                <td>${escapeHtml(customer.access_code || "")}</td>
                <td>${statusBadge}</td>
                <td>${escapeHtml(lastLoginLabel)}</td>
                <td>${escapeHtml(createdLabel)}</td>
                <td>
                    <button type="button" class="secondary" data-user-id="${Number(customer.id)}" onclick="toggleAccountStatus(this)" title="${isActive ? "Pause this account's login access" : "Resume this account's login access"}">${toggleLabel}</button>
                    <button type="button" class="btn-delete" data-user-id="${Number(customer.id)}" data-username="${escapeHtml(String(customer.username || ""))}" onclick="deleteAccountFromButton(this)">Delete</button>
                </td>
            </tr>
        `;
    }).join("");
}

async function toggleAccountStatus(button) {
    const userId = Number(button?.dataset?.userId || 0);
    if (!userId) {
        return;
    }

    button.disabled = true;
    try {
        const response = await fetch(`/admin/toggle_user_status/${encodeURIComponent(userId)}`, {
            method: "POST",
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.error || `Update failed (HTTP ${response.status})`);
        }

        showSuccess(result.message || "Account status updated");
        await loadCustomerAccounts();
    } catch (error) {
        showError(error.message);
        button.disabled = false;
    }
}

async function setAllCustomerStatus(isActive) {
    const label = isActive ? "resume" : "pause";
    const confirmed = window.confirm(`Are you sure you want to ${label} ALL customer accounts?`);
    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch("/admin/set_all_customer_status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ is_active: isActive }),
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.error || `Update failed (HTTP ${response.status})`);
        }

        showSuccess(result.message || "Accounts updated");
        await loadCustomerAccounts();
    } catch (error) {
        showError(error.message);
    }
}

function deleteAccountFromButton(button) {
    const userId = Number(button?.dataset?.userId || 0);
    const username = String(button?.dataset?.username || "");
    return deleteAccount(userId, username);
}

async function loadCustomerAccounts() {
    try {
        const response = await fetch("/admin/get_all_customers");
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || `Failed to load customers (HTTP ${response.status})`);
        }
        customerAccounts = Array.isArray(result) ? result : [];
        renderAccountsTable(customerAccounts);
    } catch (error) {
        showError(error.message);
    }
}

async function deleteAccount(userId, username) {
    const normalizedName = String(username || "");
    const confirmed = window.confirm(`Delete account "${normalizedName}"? This cannot be undone.`);
    if (!confirmed) {
        return;
    }

    const typed = window.prompt(`Type ${normalizedName} to confirm deletion:`);
    if (typed !== normalizedName) {
        showError("Username does not match. Deletion cancelled.");
        return;
    }

    try {
        const response = await fetch(`/admin/delete_user/${encodeURIComponent(userId)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.error || `Delete failed (HTTP ${response.status})`);
        }

        showSuccess(result.message || "Account deleted");
        await loadCustomerAccounts();
    } catch (error) {
        showError(error.message);
    }
}

window.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("createCustomerForm");
    if (form) {
        form.addEventListener("submit", event => {
            event.preventDefault();
            createUserAccount();
        });
    }

    if (initialStatus) {
        showSuccess(initialStatus);
    }
    if (initialError) {
        showError(initialError);
    }
    loadCustomerAccounts();
});
</script>
</body>
</html>
