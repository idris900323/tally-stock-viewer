<!DOCTYPE html>
<html>
<head>
    <title>Pricing Admin - Tally Stock Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <style>
        :root {
            --bg: #f3f6fb;
            --panel: #ffffff;
            --text: #132238;
            --muted: #5d6b82;
            --border: #d9e2ec;
            --accent: #1f6feb;
            --success-bg: #e8f5e9;
            --success-text: #276749;
            --error-bg: #fdecea;
            --error-text: #b42318;
            --search-hit: #fff8db;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(31, 111, 235, 0.14), transparent 24%),
                radial-gradient(circle at top right, rgba(20, 184, 166, 0.12), transparent 20%),
                var(--bg);
        }

        .page {
            max-width: 1320px;
            margin: 0 auto;
            padding: 28px 20px 40px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 14px 40px rgba(19, 34, 56, 0.08);
            margin-bottom: 16px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: #e8eef7;
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 320px 1fr auto;
            gap: 10px;
            align-items: end;
        }

        label {
            font-weight: 700;
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: block;
            margin-bottom: 6px;
        }

        select, input, button {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        select, input {
            background: #fff;
            width: 100%;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: 0;
            cursor: pointer;
        }

        button.secondary {
            background: #e8eef7;
            color: var(--text);
        }

        .notice {
            display: none;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .notice.success {
            color: var(--success-text);
            background: var(--success-bg);
        }

        .notice.error {
            color: var(--error-text);
            background: var(--error-bg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 980px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        tr.search-hit {
            background: var(--search-hit);
        }

        .table-wrap {
            overflow-x: auto;
        }

        .muted {
            color: var(--muted);
            font-size: 13px;
        }

        .hidden-row {
            display: none;
        }

        @media (max-width: 980px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div class="role-badge">{{ current_role|default('admin')|title }} mode</div>
        <div class="toolbar">
            <button class="secondary" onclick="window.location.href='/'">Back to Viewer</button>
            <button class="secondary" onclick="window.location.href='/train'">Train Matches</button>
            <button class="secondary" onclick="window.location.href='/admin/accounts'">Manage Accounts</button>
            <button class="secondary" onclick="window.location.href='/logout'">Logout</button>
        </div>
    </div>

    <div class="grid">
        <div class="panel">
            <h1 style="margin:0 0 10px;">Manage Pricing</h1>
            <p class="muted" style="margin:0 0 16px;">Use Global mode to set base prices. Switch to a customer to set customer-specific prices.</p>

            <div class="controls-grid">
                <div>
                    <label for="customerSelect">Pricing Mode</label>
                    <select id="customerSelect">
                        <option value="global" {% if selected_mode == 'global' %}selected{% endif %}>Global (Base Prices)</option>
                    </select>
                </div>

                <div>
                    <label for="stockSearchSelect">Global Search</label>
                    <select id="stockSearchSelect"></select>
                </div>

                <div>
                    <button type="button" class="secondary" onclick="clearStockSearch()">Clear Search</button>
                </div>
            </div>

            <div id="customerToggleRow" class="toolbar" style="margin-top:10px; {% if selected_mode != 'customer' %}display:none;{% endif %}">
                <button id="toggleContactBtn" type="button" onclick="toggleContactUs()">Toggle Contact Us</button>
                <span class="muted" id="contactState"></span>
            </div>
        </div>
    </div>

    <div id="successMsg" class="notice success"></div>
    <div id="errorMsg" class="notice error"></div>

    <div class="panel table-wrap">
        <table>
            <thead id="pricingHead"></thead>
            <tbody id="pricingBody"></tbody>
        </table>
        <div id="emptyState" class="muted" style="display:none; margin-top:10px;">No stock items found.</div>
    </div>
</div>

<script>
const selectedMode = {{ selected_mode|tojson }};
const selectedCustomerId = {{ selected_customer_id|tojson }};
const selectedCustomer = {{ selected_customer|tojson }};
const initialStatus = {{ status_message|tojson }};
const initialError = {{ error_message|tojson }};
let currentCustomer = null;
let currentRows = [];
let suppressCustomerSwitch = false;

function normalizeKey(value) {
    return String(value || "").trim().toLowerCase();
}

function showSuccess(message) {
    const el = document.getElementById("successMsg");
    el.textContent = message;
    el.style.display = "block";
    document.getElementById("errorMsg").style.display = "none";
}

function showError(message) {
    const el = document.getElementById("errorMsg");
    el.textContent = message;
    el.style.display = "block";
    document.getElementById("successMsg").style.display = "none";
}

function switchCustomer(customerId) {
    const value = String(customerId || "global").trim();
    const params = new URLSearchParams(window.location.search);
    const current = String(params.get("customer_id") || "global").trim();
    if (current === value) {
        return;
    }
    window.location.href = `/admin/pricing?customer_id=${encodeURIComponent(value)}`;
}

function initializeCustomerSelect() {
    const select = $("#customerSelect");
    select.select2({
        ajax: {
            url: "/api/search_customers",
            dataType: "json",
            delay: 250,
            data: params => ({
                q: params.term,
                page: params.page || 1,
            }),
            processResults: data => ({
                results: data.results || [],
                pagination: { more: Boolean(data.pagination && data.pagination.more) },
            }),
            cache: true,
        },
        placeholder: "Search customer",
        minimumInputLength: 0,
        allowClear: true,
        width: "100%",
    });

    select.on("change", function () {
        if (suppressCustomerSwitch) {
            return;
        }
        switchCustomer(this.value || "global");
    });

    if (selectedMode === "customer" && selectedCustomer && selectedCustomer.id) {
        suppressCustomerSwitch = true;
        const option = new Option(selectedCustomer.username || "Customer", String(selectedCustomer.id), true, true);
        select.append(option).trigger("change");
        suppressCustomerSwitch = false;
    }
}

function escapeHtml(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
}

function setupStockSearch(rows) {
    const select = $("#stockSearchSelect");
    if (select.hasClass("select2-hidden-accessible")) {
        select.select2("destroy");
    }

    select.empty();
    select.append(new Option("", "", false, false));

    const seen = new Set();
    for (const row of rows || []) {
        const stockName = String(row && row.stock_item_name ? row.stock_item_name : "").trim();
        if (!stockName) {
            continue;
        }
        const key = normalizeKey(stockName);
        if (seen.has(key)) {
            continue;
        }
        seen.add(key);
        select.append(new Option(stockName, key, false, false));
    }

    select.select2({
        placeholder: "Global search stock item (with dropdown)",
        allowClear: true,
        width: "100%",
    });

    select.off("change.stocksearch").on("change.stocksearch", function () {
        applyStockSearch(this.value || "");
    });
}

function applyStockSearch(stockKey) {
    const normalized = normalizeKey(stockKey);
    const rows = Array.from(document.querySelectorAll("#pricingBody tr[data-stock-key]"));
    let visible = 0;
    let firstHit = null;

    for (const row of rows) {
        const key = normalizeKey(row.dataset.stockKey || "");
        const isMatch = !normalized || key === normalized;
        row.classList.remove("hidden-row", "search-hit");
        if (!isMatch) {
            row.classList.add("hidden-row");
            continue;
        }
        visible += 1;
        if (normalized) {
            row.classList.add("search-hit");
            if (!firstHit) {
                firstHit = row;
            }
        }
    }

    const empty = document.getElementById("emptyState");
    if (empty) {
        empty.style.display = visible === 0 ? "block" : "none";
    }

    if (firstHit) {
        firstHit.scrollIntoView({ behavior: "smooth", block: "center" });
    }
}

function clearStockSearch() {
    const select = $("#stockSearchSelect");
    select.val(null).trigger("change");
    applyStockSearch("");
}

function renderPricingTable(mode, rows) {
    const head = document.getElementById("pricingHead");
    const body = document.getElementById("pricingBody");
    const empty = document.getElementById("emptyState");

    if (!Array.isArray(rows) || rows.length === 0) {
        head.innerHTML = "";
        body.innerHTML = "";
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    if (mode === "global") {
        head.innerHTML = `
            <tr>
                <th style="width:120px;">Car Model</th>
                <th>Stock Item</th>
                <th style="width:280px;">Base Price</th>
                <th style="width:130px;">Action</th>
            </tr>
        `;

        body.innerHTML = rows.map(row => `
            <tr data-stock-item="${escapeHtml(row.stock_item_name)}" data-stock-key="${escapeHtml(normalizeKey(row.stock_item_name))}">
                <td>${escapeHtml(row.car_model || "")}</td>
                <td>${escapeHtml(row.stock_item_name || "")}</td>
                <td><input type="text" class="base-price" value="${escapeHtml(row.base_price || "")}" placeholder="e.g. Rs 1500"></td>
                <td><button type="button" class="secondary" onclick="saveRow(this)">Save</button></td>
            </tr>
        `).join("");
        return;
    }

    const customerLabel = currentCustomer && currentCustomer.username ? currentCustomer.username : "Customer";
    head.innerHTML = `
        <tr>
            <th style="width:120px;">Car Model</th>
            <th>Stock Item</th>
            <th style="width:220px;">Custom Price (${escapeHtml(customerLabel)})</th>
            <th style="width:220px;">Default Base Price</th>
            <th style="width:130px;">Action</th>
        </tr>
    `;

    body.innerHTML = rows.map(row => {
        const defaultText = row.default_display || "Contact Us";
        return `
            <tr data-stock-item="${escapeHtml(row.stock_item_name)}" data-stock-key="${escapeHtml(normalizeKey(row.stock_item_name))}">
                <td>${escapeHtml(row.car_model || "")}</td>
                <td>${escapeHtml(row.stock_item_name || "")}</td>
                <td><input type="text" class="custom-price" value="${escapeHtml(row.custom_price || "")}" placeholder="Leave blank to use default"></td>
                <td><span class="muted">Default: ${escapeHtml(defaultText)}</span></td>
                <td><button type="button" class="secondary" onclick="saveRow(this)">Save</button></td>
            </tr>
        `;
    }).join("");
}

async function toggleContactUs() {
    if (selectedMode !== "customer" || !selectedCustomerId) {
        return;
    }

    try {
        const response = await fetch("/admin/toggle_contact_us", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ customer_id: selectedCustomerId }),
        });

        const payload = await response.json();
        if (!response.ok) {
            throw new Error(payload.error || `Toggle failed (HTTP ${response.status})`);
        }

        showSuccess("Contact Us mode updated.");
        const forceEnabled = Boolean(payload.force_contact_us);
        const button = document.getElementById("toggleContactBtn");
        const state = document.getElementById("contactState");
        if (button) {
            button.textContent = forceEnabled ? "Disable Contact Us" : "Enable Contact Us";
        }
        if (state) {
            state.textContent = `Current: ${forceEnabled ? "Contact Us ON" : "Contact Us OFF"}`;
        }
    } catch (error) {
        showError(error.message);
    }
}

async function loadPricingData() {
    try {
        const customerParam = selectedMode === "customer" && selectedCustomerId ? String(selectedCustomerId) : "global";
        const response = await fetch(`/admin/pricing_data?customer_id=${encodeURIComponent(customerParam)}`);
        const payload = await response.json();

        if (!response.ok) {
            throw new Error(payload.error || `Failed to load pricing data (HTTP ${response.status})`);
        }

        currentCustomer = payload.selected_customer || null;
        currentRows = Array.isArray(payload.rows) ? payload.rows : [];

        const toggleRow = document.getElementById("customerToggleRow");
        const toggleBtn = document.getElementById("toggleContactBtn");
        const contactState = document.getElementById("contactState");
        if (payload.mode === "customer" && currentCustomer && toggleRow) {
            toggleRow.style.display = "";
            const forceEnabled = Boolean(currentCustomer.force_contact_us);
            if (toggleBtn) {
                toggleBtn.textContent = forceEnabled ? "Disable Contact Us" : "Enable Contact Us";
            }
            if (contactState) {
                contactState.textContent = `Current: ${forceEnabled ? "Contact Us ON" : "Contact Us OFF"}`;
            }
        } else if (toggleRow) {
            toggleRow.style.display = "none";
        }

        renderPricingTable(payload.mode || "global", currentRows);
        setupStockSearch(currentRows);
        applyStockSearch($("#stockSearchSelect").val() || "");
    } catch (error) {
        showError(error.message);
    }
}

async function saveRow(button) {
    const row = button.closest("tr");
    if (!row) {
        return;
    }

    const stockItem = row.dataset.stockItem || "";
    if (!stockItem) {
        showError("Missing stock item name.");
        return;
    }

    try {
        const payload = {
            mode: selectedMode,
            stock_item_name: stockItem,
        };

        if (selectedMode === "global") {
            payload.base_price = row.querySelector(".base-price")?.value || "";
            payload.custom_price = "";
        } else {
            payload.customer_id = selectedCustomerId;
            payload.base_price = "";
            payload.custom_price = row.querySelector(".custom-price")?.value || "";
        }

        const response = await fetch("/admin/save_price", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });

        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || `Save failed (HTTP ${response.status})`);
        }

        showSuccess(`Saved price for ${stockItem}`);
        await loadPricingData();
    } catch (error) {
        showError(error.message);
    }
}

window.addEventListener("DOMContentLoaded", () => {
    initializeCustomerSelect();
    setupStockSearch([]);
    if (initialStatus) {
        showSuccess(initialStatus);
    }
    if (initialError) {
        showError(initialError);
    }
    loadPricingData();
});
</script>
</body>
</html>
