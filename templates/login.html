<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Super Seatings</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='shared.css') }}">
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #14213d;
            --muted: #607086;
            --border: #d6e0ea;
            --danger: #b91c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 26%),
                radial-gradient(circle at top right, rgba(29, 78, 216, 0.12), transparent 22%),
                var(--bg);
            color: var(--text);
        }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
        }

        .panel {
            width: min(100%, 520px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 18px 50px rgba(20, 33, 61, 0.1);
        }

        .brand {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .brand img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.5;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 16px;
        }

        .notice {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            font-size: 13px;
        }

        .hint {
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 12px;
            border: 0;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
        }

        .contact-footer {
            width: min(100%, 520px);
            margin: 18px auto 0;
            /* Reserves clearance below the text so the fixed WhatsApp
               button (bottom-right, up to ~78px tall including its offset)
               never sits on top of the phone link, at any viewport height. */
            padding-bottom: 90px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .contact-footer h2 {
            margin: 0 0 4px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
        }

        .contact-footer a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .contact-footer a:hover {
            text-decoration: underline;
        }

        .whatsapp-fab {
            position: fixed;
            right: 20px;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(20, 33, 61, 0.3);
            z-index: 900;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .whatsapp-fab svg {
            width: 58%;
            height: 58%;
            color: #fff;
        }

        .whatsapp-fab:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 22px rgba(20, 33, 61, 0.35);
        }

        .whatsapp-fab:active {
            transform: scale(0.97);
        }

        @media (max-width: 640px) {
            .page {
                padding: 14px;
            }

            .panel {
                padding: 20px;
            }

            .actions button {
                width: 100%;
            }

            h1 {
                font-size: 26px;
            }

            .whatsapp-fab {
                width: 52px;
                height: 52px;
                right: 16px;
                bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>
<body>
<div class="page">
    <form class="panel" method="post" action="/login">
        <div class="brand"><img src="{{ url_for('static', filename='logo.jpg') }}" alt="Super Seatings logo"></div>
        <h1>Sign in</h1>
        <p>Welcome to Super Seatings. Sign in with your username and access code to browse our designs.</p>

        {% if error %}
        <div class="notice">{{ error }}</div>
        {% endif %}

        <input type="hidden" name="next" value="{{ next_url }}">

        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="access_code">Access Code</label>
            <input id="access_code" name="access_code" type="password" autocomplete="current-password" required>
        </div>

        <div class="hint">
            Ask admin if you need account access or code reset.
        </div>

        <div class="actions">
            <button type="submit">Continue</button>
        </div>
    </form>

    <footer class="contact-footer">
        <h2>Contact Us</h2>
        <p>No. 1, Ramasamy Street, Woods Road, Anna Salai, Chennai - 600002</p>
        <p><a href="tel:+919500048983">+91 95000 48983</a></p>
    </footer>
</div>

<a class="whatsapp-fab" href="https://wa.me/919500048983" target="_blank" rel="noopener noreferrer" aria-label="Chat with us on WhatsApp" title="Chat with us on WhatsApp">

    </svg>
</a>
</body>
</html>
