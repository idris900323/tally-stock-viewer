<!DOCTYPE html>
<html>
<head>
    <title>Login - Tally Stock Viewer</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #14213d;
            --muted: #607086;
            --border: #d6e0ea;
            --accent: #0f766e;
            --danger: #b91c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 26%),
                radial-gradient(circle at top right, rgba(29, 78, 216, 0.12), transparent 22%),
                var(--bg);
            color: var(--text);
        }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
        }

        .top-link {
            position: absolute;
            top: 16px;
            left: 16px;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .panel {
            width: min(100%, 520px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 18px 50px rgba(20, 33, 61, 0.1);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.5;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 14px;
        }

        .notice {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            font-size: 13px;
        }

        .hint {
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 12px;
            border: 0;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
        }

        @media (max-width: 640px) {
            .page {
                padding: 14px;
            }

            .panel {
                padding: 20px;
            }

            .actions button {
                width: 100%;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <a class="top-link" href="/">Back to Viewer</a>
    <form class="panel" method="post" action="/login">
        <h1>Sign in</h1>
        <p>Use your assigned username and access code.</p>

        {% if error %}
        <div class="notice">{{ error }}</div>
        {% endif %}

        <input type="hidden" name="next" value="{{ next_url }}">

        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="access_code">Access Code</label>
            <input id="access_code" name="access_code" type="password" autocomplete="current-password" required>
        </div>

        <div class="hint">
            Ask admin if you need account access or code reset.
        </div>

        <div class="actions">
            <button type="submit">Continue</button>
        </div>
    </form>
</div>
</body>
</html>
